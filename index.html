<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Game Hub</title>
  <style>
    :root{--bg:#080b12;--panel:#111827;--card:#182235;--line:#293750;--text:#f8fafc;--muted:#9aa9bf;--accent:#38bdf8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#14213a,#080b12 48%);color:var(--text);font:15px system-ui,sans-serif}
    button{font:inherit;touch-action:manipulation}.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.sidebar{padding:22px 16px;background:#0d1422;border-right:1px solid var(--line)}.sidebar h1{margin:0 0 8px}.desc,.hint{color:var(--muted);line-height:1.5}.games{display:grid;gap:10px;margin-top:24px}.game{display:grid;gap:4px;width:100%;padding:13px;text-align:left;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer}.game:hover,.game.active{border-color:var(--accent);background:#1d3048}.game span{color:var(--muted);font-size:13px}main{min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}.title{font-size:20px;font-weight:700}.reset{padding:8px 14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer}.board{height:calc(100vh - 73px);padding:20px}.board iframe{display:block;width:100%;height:100%;min-height:500px;border:0;border-radius:10px;background:#fff}.empty,.message{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center}
    @media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.games{grid-template-columns:repeat(2,minmax(0,1fr))}.board{height:calc(100vh - 300px);padding:12px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>🎮 Game Hub</h1>
      <p class="desc">Games that run directly in this page.</p>
      <div class="games" id="games"></div>
      <p class="hint">Click a game above to start it.</p>
    </aside>
    <main>
      <div class="toolbar"><div class="title" id="title">Choose a game</div><button class="reset" id="reset" type="button" hidden>Restart</button></div>
      <section class="board" id="board"><div class="empty">Select a game on the left to start.</div></section>
    </main>
  </div>
  <script>
    const games=[
      ['bitlife','BitLife','Live a virtual life'],
      ['spacewaves','Space Waves','Navigate the waves'],
      ['soccerlegends','Soccer Legends','Play soccer matches'],
      ['motox3m','Moto X3M','Ride the track']
    ];
    const list=document.getElementById('games'),board=document.getElementById('board'),title=document.getElementById('title'),reset=document.getElementById('reset');
    let current=null;

    games.forEach(([id,name,sub])=>{
      const button=document.createElement('button');
      button.type='button';
      button.className='game';
      const strong=document.createElement('strong');
      strong.textContent=name;
      const span=document.createElement('span');
      span.textContent=sub;
      button.appendChild(strong);
      button.appendChild(span);
      button.addEventListener('click',()=>start(id,button));
      list.appendChild(button);
    });

    function start(id,button){
      document.querySelectorAll('.game').forEach(x=>x.classList.remove('active'));
      button.classList.add('active');
      current=id;
      title.textContent=games.find(g=>g[0]===id)[1];
      reset.hidden=false;
      render();
    }

    function render(){
      const links={
        bitlife:'https://bitlife-freeonline.github.io/',
        spacewaves:'https://spacewavesunblocked.github.io/',
        soccerlegends:'https://spacewavesunblocked.github.io/soccer-legends.html',
        motox3m:'https://moto-x3monline.github.io/'
      };

      board.innerHTML='';
      const iframe=document.createElement('iframe');
      iframe.src=links[current];
      iframe.title=title.textContent;
      iframe.loading='lazy';
      iframe.setAttribute('allowfullscreen','true');
      board.appendChild(iframe);
    }

    reset.addEventListener('click',()=>{if(current)render()});
  </script>
</body>
</html>
