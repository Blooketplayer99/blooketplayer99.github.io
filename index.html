<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Game Hub</title>
  <style>
    :root{--bg:#080b12;--panel:#111827;--card:#182235;--line:#293750;--text:#f8fafc;--muted:#9aa9bf;--accent:#38bdf8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#14213a,#080b12 48%);color:var(--text);font:15px system-ui,sans-serif}
    button{font:inherit;touch-action:manipulation}.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.sidebar{padding:22px 16px;background:#0d1422;border-right:1px solid var(--line)}.sidebar h1{margin:0 0 10px;font-size:1.9rem}.desc{margin:0 0 18px;color:var(--muted)}.games{display:grid;gap:10px}.game{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,#182235,#121b2b);color:var(--text);text-align:left;cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}.game:hover{transform:translateY(-1px);border-color:#4b6ea7}.game.active{background:linear-gradient(180deg,#1f3b5d,#16283d);border-color:#5ab7ff;box-shadow:0 0 0 1px rgba(56,189,248,.5)}.game strong{font-size:1.02rem}.game span{color:var(--muted);font-size:.77rem}.hint{margin-top:18px;color:var(--muted);font-size:.9rem}main{padding:18px 20px 24px;display:flex;flex-direction:column;min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 14px}.title{font-size:clamp(1.5rem,2.2vw,2.2rem);font-weight:700}.reset{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#111827;color:var(--text);cursor:pointer}.board{flex:1;display:grid;place-items:center;background:rgba(14,20,31,.72);border:1px solid var(--line);border-radius:18px;min-height:520px;box-shadow:inset 0 1px 0 rgba(148,163,184,.08)}.empty,.message{max-width:640px;padding:22px;text-align:center;color:var(--muted)}.status{margin:0 0 8px;color:var(--text);font-size:1.15rem;font-weight:600}.board iframe{width:100%;height:100%;min-height:520px;border:0;border-radius:18px;background:#000}.message{color:var(--muted)}@media(max-width:760px){.app{display:block}.sidebar{padding:16px;border-right:0;border-bottom:1px solid var(--line)}.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}main{padding:12px}.board{min-height:420px}.board iframe{min-height:420px}}@media(max-width:380px){.games{grid-template-columns:1fr}.game span{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>🎮 Game Hub</h1>
      <p class="desc">Small games that run directly in this page.</p>
      <div class="games" id="games"></div>
      <p class="hint">Click a game above to start it.</p>
    </aside>
    <main>
      <div class="toolbar"><div class="title" id="title">Choose a game</div><button class="reset" id="reset" type="button" hidden>Restart</button></div>
      <section class="board" id="board"><div class="empty">Select a game on the left to start.</div></section>
    </main>
  </div>
  <script>
    const games=[
      ['2048','2048','Swipe or use arrows'],
      ['snake','Snake','Touch controls included'],
      ['ttt','Tic-Tac-Toe','Beat the computer'],
      ['mines','Minesweeper','Find safe squares'],
      ['pong','Pong','Classic table tennis'],
      ['motox3m','Moto X3M','Ride the track']
    ];
    const list=document.getElementById('games'),board=document.getElementById('board'),title=document.getElementById('title'),reset=document.getElementById('reset');
    let current=null;

    games.forEach(([id,name,sub])=>{
      const button=document.createElement('button');
      button.type='button';
      button.className='game';
      const strong=document.createElement('strong');
      strong.textContent=name;
      const span=document.createElement('span');
      span.textContent=sub;
      button.appendChild(strong);
      button.appendChild(span);
      button.addEventListener('click',()=>start(id,button));
      list.appendChild(button);
    });

    function start(id,button){
      document.querySelectorAll('.game').forEach(x=>x.classList.remove('active'));
      button.classList.add('active');
      current=id;
      title.textContent=games.find(g=>g[0]===id)[1];
      reset.hidden=false;
      render();
    }

    function render(){
      const links={
        bitlife:'https://bitlife-freeonline.github.io/',
        spacewaves:'https://spacewavesunblocked.github.io/',
        soccerlegends:'https://spacewavesunblocked.github.io/soccer-legends.html',
        motox3m:'https://moto-x3monline.github.io/'
      };

      if(links[current]){
        board.innerHTML='';
        const iframe=document.createElement('iframe');
        iframe.src=links[current];
        iframe.title=title.textContent;
        iframe.loading='lazy';
        iframe.setAttribute('allowfullscreen','true');
        board.appendChild(iframe);
        return;
      }

      board.innerHTML='<div class="message"><p class="status">'+title.textContent+' selected.</p><p>The game is ready to start. Use the controls shown here once the game loads.</p></div>';
    }

    reset.addEventListener('click',()=>{if(current)render()});
  </script>
</body>
</html>
