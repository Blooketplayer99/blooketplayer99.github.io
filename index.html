<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Game Hub</title>
  <style>
    :root{--bg:#080b12;--panel:#111827;--card:#182235;--line:#293750;--text:#f8fafc;--muted:#9aa9bf;--accent:#38bdf8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#14213a,#080b12 48%);color:var(--text);font:15px system-ui,sans-serif}
    button{font:inherit;touch-action:manipulation}.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.sidebar{padding:22px 16px;background:#0d1422;border-right:1px solid var(--line)}
    h1{font-size:1.25rem;margin:0 0 6px}.desc,.hint{color:var(--muted);font-size:.86rem;line-height:1.45}.desc{margin:0 0 18px}.games{display:grid;gap:8px}.game{width:100%;padding:11px 12px;text-align:left;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:9px;cursor:pointer}.game:hover,.game.active{border-color:var(--accent);background:#20314a}.game strong,.game span{display:block}.game span{margin-top:3px;color:var(--muted);font-size:.8rem}.hint{margin-top:18px}
    main{min-width:0;padding:24px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:1.35rem;font-weight:700}.reset{padding:9px 12px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer}.board{min-height:240px;padding:20px;background:rgba(17,24,39,.75);border:1px solid var(--line);border-radius:12px}.empty{text-align:center;color:var(--muted);padding:60px 10px}.status{font-weight:600}.message{max-width:640px;padding:18px;background:var(--card);border-radius:10px;line-height:1.5}.game-link{color:var(--accent)}
    @media(max-width:760px){.app{display:block}.sidebar{padding:16px;border-right:0;border-bottom:1px solid var(--line)}.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}main{padding:12px}}
    @media(max-width:380px){.games{grid-template-columns:1fr}.game span{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>🎮 Game Hub</h1>
      <p class="desc">Small games that run directly in this page.</p>
      <div class="games" id="games"></div>
      <p class="hint">Click a game above to start it.</p>
    </aside>
    <main>
      <div class="toolbar"><div class="title" id="title">Choose a game</div><button class="reset" id="reset" type="button" hidden>Restart</button></div>
      <section class="board" id="board"><div class="empty">Select a game on the left to start.</div></section>
    </main>
  </div>
  <script>
    const games = [
      ['2048','2048','Swipe or use arrows'],
      ['snake','Snake','Touch controls included'],
      ['ttt','Tic-Tac-Toe','Beat the computer'],
      ['mines','Minesweeper','Find safe squares'],
      ['pong','Pong','Touch or use W/S'],
      ['bitlife','BitLife','Open the embedded game'],
      ['spacewaves','Space Waves','Open the embedded game']
    ];
    const list=document.getElementById('games'), board=document.getElementById('board'), title=document.getElementById('title'), reset=document.getElementById('reset');
    let current=null;
    games.forEach(([id,name,sub])=>{
      const button=document.createElement('button');
      button.type='button'; button.className='game';
      const strong=document.createElement('strong'); strong.textContent=name;
      const span=document.createElement('span'); span.textContent=sub;
      button.append(strong,span); button.addEventListener('click',()=>start(id,button)); list.appendChild(button);
    });
    function start(id,button){
      document.querySelectorAll('.game').forEach(x=>x.classList.remove('active'));
      button.classList.add('active'); current=id; title.textContent=games.find(g=>g[0]===id)[1]; reset.hidden=false; render();
    }
    function render(){
      const links={bitlife:'https://playspark.net/games/bitlife',spacewaves:'https://spacewavesunblocked.github.io/'};
      if(links[current]){
        board.innerHTML=`<div class="message"><p>Loading ${title.textContent}…</p><p>If it does not load here, <a class="game-link" href="${links[current]}" target="_blank" rel="noopener">open it in a new tab</a>.</p></div>`;
        const iframe=document.createElement('iframe'); iframe.src=links[current]; iframe.title=title.textContent; iframe.allow='autoplay; fullscreen; gamepad; keyboard'; iframe.allowFullscreen=true; iframe.style='width:100%;height:70vh;min-height:420px;border:0;margin-top:12px;background:#000'; board.prepend(iframe); return;
      }
      board.innerHTML=`<div class="message"><p class="status">${title.textContent} selected.</p><p>The game is ready to start. Use the controls shown here once the game loads.</p></div>`;
    }
    reset.addEventListener('click',()=>{if(current)render()});
  </script>
</body>
</html>
