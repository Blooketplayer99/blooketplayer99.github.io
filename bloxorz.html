<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Bloxorz — Game Hub</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #000; color: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 900px); text-align: center; }
    h1 { margin: 0 0 8px; }
    p { color: #aab4c5; }
    .game { width: 100%; aspect-ratio: 850 / 600; min-height: 360px; background: #111; border: 1px solid #293750; border-radius: 12px; overflow: hidden; }
    ruffle-player { width: 100%; height: 100%; }
    .links { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 16px; }
    a { color: #38bdf8; }
    @media (max-width: 600px) { body { padding: 12px; } .game { min-height: 300px; } }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <main>
    <h1>Bloxorz</h1>
    <p>Use the arrow keys to roll the block to the goal.</p>
    <div class="game">
      <embed src="https://raw.githubusercontent.com/CBGamesdev/chilibowlflash/main/bloxorz.swf" width="850" height="600" type="application/x-shockwave-flash" aria-label="Bloxorz game">
    </div>
    <div class="links">
      <a href="/">Back to Game Hub</a>
      <a href="https://github.com/CBGamesdev/chilibowlflash" rel="noreferrer">Game file source and credit</a>
    </div>
    <p>Flash emulation provided by <a href="https://ruffle.rs/" rel="noreferrer">Ruffle</a>.</p>
  </main>
</body>
</html>
